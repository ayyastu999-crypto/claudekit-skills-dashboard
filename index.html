<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaudeKit Skills Dashboard v2.16.0</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a2e;
    --border: #2a2a3e;
    --text: #e4e4ef;
    --text-muted: #8888a0;
    --accent: #7c6aef;
    --accent2: #a78bfa;
    --green: #34d399;
    --orange: #fb923c;
    --pink: #f472b6;
    --blue: #60a5fa;
    --cyan: #22d3ee;
    --red: #f87171;
    --yellow: #fbbf24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .hero {
    text-align: center;
    padding: 80px 20px 50px;
    background: linear-gradient(180deg, #1a1040 0%, #120e25 40%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(124,106,239,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(34,211,238,0.06) 0%, transparent 50%);
    animation: heroGlow 8s ease-in-out infinite alternate;
  }

  @keyframes heroGlow {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-5%, 5%); }
  }

  .hero > * { position: relative; z-index: 1; }

  .hero h1 {
    font-size: 3.2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #c4b5fd, var(--cyan), #818cf8);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    animation: gradientShift 6s ease infinite;
    letter-spacing: -0.5px;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .hero .version {
    color: var(--cyan);
    font-size: 0.9rem;
    font-weight: 700;
    background: linear-gradient(135deg, rgba(124,106,239,0.2), rgba(34,211,238,0.15));
    display: inline-block;
    padding: 6px 20px;
    border-radius: 20px;
    margin-bottom: 18px;
    border: 1px solid rgba(124,106,239,0.3);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .hero p {
    color: var(--text-muted);
    font-size: 1.15rem;
    max-width: 650px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 20px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat .num {
    font-size: 2.4rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent2), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .stat .label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }

  .controls {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
  }

  .controls-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 250px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 14px 18px 14px 46px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: all 0.3s;
  }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,239,0.15);
    background: rgba(18,18,26,0.95);
  }

  .search-box::before {
    content: "\1F50D";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.1rem;
  }

  .filter-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-tag {
    padding: 8px 18px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
  }

  .filter-tag:hover {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(124,106,239,0.1);
    transform: translateY(-1px);
  }

  .filter-tag.active {
    background: linear-gradient(135deg, var(--accent), #6366f1);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 16px rgba(124,106,239,0.35);
    transform: translateY(-1px);
  }

  .count-badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 0.75rem;
    margin-left: 4px;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px 20px;
  }

  .results-info {
    color: var(--text-muted);
    margin-bottom: 20px;
    font-size: 0.9rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 16px;
  }

  @media (max-width: 500px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: linear-gradient(145deg, var(--surface), rgba(26,26,46,0.6));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: default;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--cyan), var(--pink));
    background-size: 200% 100%;
    opacity: 0;
    transition: opacity 0.35s;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: radial-gradient(circle at 50% 0%, rgba(124,106,239,0.06), transparent 60%);
    opacity: 0;
    transition: opacity 0.35s;
    pointer-events: none;
  }

  .card:hover {
    border-color: rgba(124,106,239,0.5);
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 12px 40px rgba(124,106,239,0.2), 0 4px 16px rgba(0,0,0,0.3);
  }

  .card:hover::before { opacity: 1; animation: borderGlow 2s linear infinite; }
  .card:hover::after { opacity: 1; }

  @keyframes borderGlow {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }

  .card-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.05);
  }

  .card-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }

  .card-command {
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.8rem;
    color: var(--accent2);
    margin-top: 2px;
  }

  .card-desc {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .card-usage {
    background: linear-gradient(135deg, rgba(26,26,46,0.8), rgba(18,18,26,0.9));
    border: 1px solid rgba(34,211,238,0.15);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 14px;
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    color: var(--cyan);
    overflow-x: auto;
    white-space: nowrap;
    position: relative;
  }

  .card-usage::before {
    content: '>';
    color: var(--accent2);
    margin-right: 8px;
    font-weight: bold;
  }

  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .tag-dev { background: rgba(96,165,250,0.15); color: var(--blue); }
  .tag-ai { background: rgba(167,139,250,0.15); color: var(--accent2); }
  .tag-ops { background: rgba(251,146,60,0.15); color: var(--orange); }
  .tag-design { background: rgba(244,114,182,0.15); color: var(--pink); }
  .tag-test { background: rgba(52,211,153,0.15); color: var(--green); }
  .tag-tool { background: rgba(34,211,238,0.15); color: var(--cyan); }
  .tag-workflow { background: rgba(251,191,36,0.15); color: var(--yellow); }
  .tag-security { background: rgba(248,113,113,0.15); color: var(--red); }

  .footer {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    margin-top: 40px;
    background: linear-gradient(180deg, var(--bg), #0d0d18);
  }

  .tag {
    transition: transform 0.2s;
  }
  .tag:hover { transform: scale(1.05); }

  ::selection {
    background: rgba(124,106,239,0.4);
    color: #fff;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .expand-btn {
    background: linear-gradient(135deg, rgba(124,106,239,0.1), rgba(34,211,238,0.08));
    border: 1px solid rgba(124,106,239,0.25);
    color: var(--accent2);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    margin-top: 10px;
    transition: all 0.3s;
  }

  .expand-btn:hover {
    background: linear-gradient(135deg, rgba(124,106,239,0.2), rgba(34,211,238,0.15));
    border-color: var(--accent);
    color: var(--cyan);
    transform: translateY(-1px);
  }

  .card-detail {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.85rem;
    line-height: 1.6;
  }

  .card-detail.open { display: block; }

  .detail-section {
    margin-bottom: 10px;
  }

  .detail-section strong {
    color: var(--text);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .detail-section ul {
    margin-top: 4px;
    padding-left: 18px;
  }

  .detail-section li {
    margin-bottom: 2px;
  }
</style>
</head>
<body>

const categoryConfig = {
  all: { label: "Tất cả", color: "#7c6aef" },
  dev: { label: "Phát triển", color: "#60a5fa" },
  ai: { label: "AI & ML", color: "#a78bfa" },
  design: { label: "Thiết kế", color: "#f472b6" },
  ops: { label: "Vận hành", color: "#fb923c" },
  test: { label: "Kiểm thử", color: "#34d399" },
  security: { label: "Bảo mật", color: "#f87171" },
  workflow: { label: "Quy trình", color: "#fbbf24" },
  tool: { label: "Công cụ", color: "#22d3ee" },
};

const iconColors = {
  dev: "rgba(96,165,250,0.15)",
  ai: "rgba(167,139,250,0.15)",
  design: "rgba(244,114,182,0.15)",
  ops: "rgba(251,146,60,0.15)",
  test: "rgba(52,211,153,0.15)",
  security: "rgba(248,113,113,0.15)",
  workflow: "rgba(251,191,36,0.15)",
  tool: "rgba(34,211,238,0.15)",
};

let activeFilter = "all";

function getCategoryCounts() {
  const counts = { all: skills.length };
  skills.forEach(s => {
    counts[s.category] = (counts[s.category] || 0) + 1;
  });
  return counts;
}

function renderFilters() {
  const counts = getCategoryCounts();
  const container = document.getElementById("filterTags");
  container.innerHTML = Object.entries(categoryConfig).map(([key, cfg]) =>
    `<button class="filter-tag ${activeFilter === key ? 'active' : ''}" data-cat="${key}" onclick="setFilter('${key}')">${cfg.label}<span class="count-badge">${counts[key] || 0}</span></button>`
  ).join("");
}

function setFilter(cat) {
  activeFilter = cat;
  renderFilters();
  renderCards();
}

function renderCards() {
  const query = document.getElementById("search").value.toLowerCase();
  const container = document.getElementById("grid");

  const filtered = skills.filter(s => {
    const matchCategory = activeFilter === "all" || s.category === activeFilter || s.tags.includes(activeFilter);
    const matchSearch = !query ||
      s.name.toLowerCase().includes(query) ||
      s.desc.toLowerCase().includes(query) ||
      s.command.toLowerCase().includes(query) ||
      s.usage.toLowerCase().includes(query) ||
      (s.details.features && s.details.features.some(f => f.toLowerCase().includes(query))) ||
      (s.details.useCases && s.details.useCases.some(u => u.toLowerCase().includes(query)));
    return matchCategory && matchSearch;
  });

  document.getElementById("totalVisible").textContent = filtered.length;
  document.getElementById("resultsInfo").textContent = filtered.length === skills.length
    ? `Hiển thị tất cả ${skills.length} skills`
    : `Tìm thấy ${filtered.length} / ${skills.length} skills`;

  container.innerHTML = filtered.map((s, i) => `
    <div class="card" data-idx="${i}">
      <div class="card-header">
        <div class="card-icon" style="background:${iconColors[s.category] || iconColors.tool}">${s.icon}</div>
        <div>
          <div class="card-title">${s.name}</div>
          <div class="card-command">${s.command}</div>
        </div>
      </div>
      <div class="card-desc">${s.desc}</div>
      <div class="card-usage">${s.usage}</div>
      <div class="card-tags">
        ${s.tags.map(t => `<span class="tag tag-${t}">${categoryConfig[t]?.label || t}</span>`).join("")}
      </div>
      <button class="expand-btn" onclick="toggleDetail(this)">Xem chi tiết ▼</button>
      <div class="card-detail">
        ${s.details.features ? `
        <div class="detail-section">
          <strong>Tính năng</strong>
          <ul>${s.details.features.map(f => `<li>${f}</li>`).join("")}</ul>
        </div>` : ""}
        ${s.details.useCases ? `
        <div class="detail-section">
          <strong>Ứng dụng thực tế</strong>
          <ul>${s.details.useCases.map(u => `<li>${u}</li>`).join("")}</ul>
        </div>` : ""}
      </div>
    </div>
  `).join("");
}

function toggleDetail(btn) {
  const detail = btn.nextElementSibling;
  detail.classList.toggle("open");
  btn.textContent = detail.classList.contains("open") ? "Thu gọn ▲" : "Xem chi tiết ▼";
}

document.getElementById("search").addEventListener("input", renderCards);

document.getElementById("totalSkills").textContent = skills.length;
document.getElementById("totalCategories").textContent = Object.keys(categoryConfig).length - 1;

renderFilters();
renderCards();
</script>
